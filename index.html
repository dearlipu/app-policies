<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Policies</title>
  <meta name="description" content="Privacy policies and terms and conditions for our apps.">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #666d78;
      --border: #e3e6ea;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1e24;
        --text: #eceff3;
        --muted: #9aa3af;
        --border: #2a2f37;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { margin: 0 0 8px; font-size: 1.9rem; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    .app {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .app h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .app p { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }
    .links a {
      display: inline-block;
      margin-right: 16px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>App Policies</h1>
    <p class="sub">Privacy policies and terms and conditions for all our apps.</p>

    <!-- ===== APP 1 ===== -->
    <div class="app">
      <h2>App One</h2>
      <p>Short description of App One.</p>
      <div class="links">
        <a href="app-one/privacy-policy.html">Privacy Policy</a>
        <a href="app-one/terms-and-conditions.html">Terms &amp; Conditions</a>
      </div>
    </div>

    <!-- ===== APP 2 ===== -->
    <div class="app">
      <h2>App Two</h2>
      <p>Short description of App Two.</p>
      <div class="links">
        <a href="app-two/privacy-policy.html">Privacy Policy</a>
        <a href="app-two/terms-and-conditions.html">Terms &amp; Conditions</a>
      </div>
    </div>

    <!-- To add a new app, copy one of the blocks above and change the name and folder. -->

    <footer>
      Contact: <a href="mailto:you@example.com" style="color: var(--accent);">you@example.com</a>
    </footer>
  </div>
</body>
</html>
